name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security.yml"
  # Weekly cron catches advisories published between pushes.
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

# Top-level permissions default to read-all; individual jobs request
# elevated scopes only where required.
permissions: read-all

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_AUDIT_VERSION: "0.22.1"

jobs:
  cargo-audit:
    name: Audit dependencies for CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-tools-audit-${{ env.CARGO_AUDIT_VERSION }}
          restore-keys: ${{ runner.os }}-cargo-tools-audit-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --force --version "${CARGO_AUDIT_VERSION}"

      - name: Run cargo audit
        # `cargo audit` exits non-zero when it finds any advisory. Override
        # with `--ignore RUSTSEC-XXXX-YYYY` on the command line for known
        # accepted risks; do not blanket-ignore here.
        run: cargo audit

  # NOTE: a dedicated `.github/workflows/gitleaks.yml` workflow covers all
  # branches and PRs with gitleaks. Defining a gitleaks job here as well
  # would run the same scan twice on every push to main and every PR —
  # wasted CI minutes with no benefit. Keep the two workflows in sync if
  # the gitleaks configuration needs to change.
