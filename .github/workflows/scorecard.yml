name: OSSF Scorecard

# Runs OSSF Scorecard and uploads SARIF results to the GitHub Security tab.
# `publish_results: true` posts results to the OpenSSF REST API; this only
# works for public repositories. The repo is public, so this is enabled.

on:
  # Re-run on every branch protection rule change so the badge stays accurate.
  branch_protection_rule:
  # Weekly scan on Monday at 01:30 UTC.
  schedule:
    - cron: "30 1 * * 1"
  # Run on every push to main for tighter feedback.
  push:
    branches: [main]
  workflow_dispatch:

# Top-level permissions default to read-all; the scorecard job needs
# `security-events: write` and `id-token: write` at job scope only.
permissions: read-all

# Scorecard is non-blocking and advisory; cancel superseded runs to save
# CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      # Required to upload SARIF results to the Security tab.
      security-events: write
      # Required to publish results and access repo details.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results: true posts to the OpenSSF REST API; only valid for
          # public repositories (this repo is public).
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
