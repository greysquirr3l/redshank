version: 2

# Keep Rust dependencies and GitHub Actions versions fresh. Auto-merge for
# patch updates is handled by `.github/workflows/dependabot-automerge.yml`.
#
# `groups` reduce PR noise: a single PR bumps all transitive deps that
# share an ecosystem, instead of one PR per leaf crate.

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    groups:
      rust-direct:
        applies-to: version-updates
        patterns:
          - "redshank-*"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    groups:
      actions:
        applies-to: version-updates
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
